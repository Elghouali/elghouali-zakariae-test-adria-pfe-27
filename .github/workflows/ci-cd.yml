name: Scaffold validation
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Validate Maven module structure
        run: mvn --batch-mode --no-transfer-progress validate
# Add compilation, tests, image build, registry publication and schematic deployment
# when service implementations exist. This workflow validates structure only.

